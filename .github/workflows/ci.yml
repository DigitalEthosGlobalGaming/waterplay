name: CI

# Pushes to main are checked by pages.yml before deploying; this covers pull requests.
on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:desktop
      - run: npm run check:bundle
